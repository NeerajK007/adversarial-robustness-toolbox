<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MobileNetV2 Defect Classifier + Adversarial Attack</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #result, #advResult { margin-top: 10px; font-weight: bold; }
    img { max-width: 300px; margin-top: 10px; }
    select, button, input { margin-top: 10px; display: block; }
    #attackBtn { background-color: red; color: white; }
    .pred-container { margin-top: 20px; }
  
    /* Extra spacing between attack dropdown and epsilon */
    #attackSelect {
      margin-bottom: 15px;  /* adjust value as you like */
    }
  </style>
</head>
<body>
  <h1>MobileNetV2 Synthetic Defect Classifier</h1>

  <!-- Image Selection -->
  <input type="file" id="imageInput" accept="image/*"><br>
  <img id="preview" src="" alt="" />

  <!-- Attack Options -->
  <label for="attackSelect">Select Attack:</label>
  <select id="attackSelect">
    <option value="fgsm" selected>FGSM</option>
    <option value="pgd" disabled>PGD (coming)</option>
    <option value="cw" disabled>C&W (coming)</option>
  </select>

  <label for="epsInput">FGSM Epsilon:</label>
  <input type="number" id="epsInput" value="0.1" step="0.01" min="0" max="1">

  <button id="attackBtn">Launch Attack</button>

  <!-- Results -->
  <div class="pred-container" id="result"></div>
  <h3>Adversarial Image:</h3>
  <img id="advPreview" src="" alt="" />

  <script>
    const imageInput = document.getElementById('imageInput');
    const attackSelect = document.getElementById('attackSelect');
    const epsInput = document.getElementById('epsInput');
    const attackBtn = document.getElementById('attackBtn');
    const resultDiv = document.getElementById('result');
    const preview = document.getElementById('preview');
    const advPreview = document.getElementById('advPreview');

    let selectedFile = null;

    imageInput.addEventListener('change', (event) => {
      selectedFile = event.target.files[0];
      if (selectedFile) {
        preview.src = URL.createObjectURL(selectedFile);
        resultDiv.innerHTML = '';
        advPreview.src = '';
      }
    });

    // ---- Adversarial Attack ----
    attackBtn.addEventListener('click', async () => {
      if (!selectedFile) return alert("Select an image first!");

      resultDiv.innerHTML = "Generating adversarial image...";
      const advForm = new FormData();
      advForm.append("file", selectedFile);
      advForm.append("attack", attackSelect.value);
      advForm.append("eps", parseFloat(epsInput.value));

      try {
        const advResponse = await fetch("http://127.0.0.1:8000/predict_adv/", {
          method: "POST",
          body: advForm
        });
        if (!advResponse.ok) throw new Error(`HTTP error ${advResponse.status}`);
        const advData = await advResponse.json();

        resultDiv.innerHTML = `
          <strong>Original Prediction:</strong> ${advData.original_label} <br>
          Confidence: ${(advData.original_confidence*100).toFixed(2)}% <br><br>
          <strong>Adversarial Prediction:</strong> ${advData.adv_label} <br>
          Confidence: ${(advData.adv_confidence*100).toFixed(2)}%
        `;

        advPreview.src = `data:image/png;base64,${advData.adv_image_base64}`;
      } catch (error) {
        resultDiv.innerHTML = `Error: ${error}`;
      }
    });
  </script>
</body>
</html>
